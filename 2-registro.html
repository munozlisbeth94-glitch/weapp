
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro - WeAPP</title>
  <!-- CSS (ruta absoluta con el nombre de tu carpeta) -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Logo -->
  <img class="logo" src="img/logo-weapp.png" alt="Logo de la empresa" />

  <!-- Registro -->
  <section class="login-section">
    <div class="login-container">
      <h2>Registro de Usuario</h2>

      <!-- OJO: acción apuntando al archivo numerado -->
      <form action="3-verificacion.html" method="get">
        <input type="text" name="nombre" placeholder="Nombres completos" required />
        <input type="text" name="apellidos" placeholder="Apellidos" required />
        <input type="text" name="direccion" placeholder="Dirección" required />
        <input type="text" name="nombre_establecimiento" placeholder="Nombre del establecimiento" required />
        <input type="date" name="fecha_nacimiento" placeholder="Fecha de nacimiento" required />
        <input type="email" name="correo" placeholder="Correo electrónico" required />
        <input type="text" name="telefono" placeholder="Teléfono" required />
        <div class="rol-container">
        <p>Selecciona tu rol:</p>

        <label class="rol-card">
        <input type="radio" name="rol" value="tendero" required>
        <div>
        🏪 <strong>Tendero</strong>
        <p>Realiza pedidos a proveedores</p>
        </div>
        </label>

        <label class="rol-card">
        <input type="radio" name="rol" value="proveedor">
        <div>
        🚚 <strong>Proveedor</strong>
        <p>Ofrece productos a tiendas</p>
        </div>
        </label>
        </div>
        <button type="submit">Registrarme</button>
      </form>

      <p class="registro">¿Ya tienes cuenta?
        <a href="1-index.html">Inicia sesión aquí</a>
      </p>
    </div>
  </section>
</body>
</html>
