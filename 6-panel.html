<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WeAPP - Panel Principal</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Estilos personalizados -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ======= HEADER ======= -->
  <header class="header">
    <div class="user-info">
      <img src="img/DSC_0004.JPG" alt="Foto de perfil" class="profile-pic">
      <div class="user-details">
        <h2 id="nombreUsuario">Usuario</h2>
        <p id="idUsuario">ID</p>
      </div>
    </div>

    <button class="menu-toggle">☰</button>

    <div class="app-logo">
      <img src="img/logo-weapp.png" alt="Logo WeAPP">
    </div>
  </header>

  <!-- ======= SIDEBAR ======= -->
  <aside class="sidebar">
    <ul>
      <li><a href="#" onclick="cargarinicio()">🏠 Inicio</a></li>
      <li><a href="#" onclick="cargarpedidos()">📦 Pedidos</a></li>
      <li><a href="#" onclick="verCarrito()">🛒 Carrito</a></li>
      <li><a href="#" onclick="cargarproveedores()">🏪 Proveedores</a></li>
      <li><a href="#" onclick="cargarconfiguracion()">⚙️ Configuración</a></li>
      <li><a href="#" onclick="cerrarsesion()">🚪 Cerrar sesión</a></li>
    </ul>
  </aside>

  <!-- ======= CONTENIDO PRINCIPAL ======= -->
  <main class="main-content" id="main-content">
  </main>

  <!-- ======= BOOTSTRAP JS ======= -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- ======= SCRIPT PRINCIPAL ======= -->
  <script src="js/main.js"></script>

  <!-- 🔐 PROTECCIÓN + DATOS USUARIO -->
  <script>
    const usuario = localStorage.getItem("usuario");

    if (!usuario) {
      window.location.href = "4-credenciales.html";
    } else {
      const data = JSON.parse(usuario);

      document.getElementById("nombreUsuario").textContent = data.nombre || "Usuario";
      document.getElementById("idUsuario").textContent = "ID: " + (data.id || "000");
    }
  </script>

</body>
</html>
